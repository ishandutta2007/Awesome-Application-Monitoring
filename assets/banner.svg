<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.4" />
    </pattern>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Dynamic CSS Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes dashFlow {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes beaconPulse {
      0% { r: 4px; opacity: 1; }
      100% { r: 18px; opacity: 0; }
    }

    .bg-grid { animation: pulseGlow 8s ease-in-out infinite; transform-origin: center; }
    .flow-line { stroke-dasharray: 12, 6; animation: dashFlow 30s linear infinite; }
    .floating-pill-1 { animation: floatPill 5s ease-in-out infinite; }
    .floating-pill-2 { animation: floatPill 6.5s ease-in-out infinite 1s; }
    .floating-pill-3 { animation: floatPill 5.8s ease-in-out infinite 2s; }
    .beacon { animation: beaconPulse 2s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
  </style>

  <!-- Layer 1: Background & Grid -->
  <rect width="1200" height="360" fill="url(#bgGradient)" rx="16" />
  <rect width="1200" height="360" fill="url(#grid)" rx="16" class="bg-grid" />

  <!-- Ambient Glow Orbs in Background -->
  <circle cx="200" cy="100" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  <circle cx="1000" cy="260" r="160" fill="#c084fc" opacity="0.1" filter="url(#glow)" />
  <circle cx="600" cy="180" r="220" fill="#6366f1" opacity="0.08" filter="url(#glow)" />

  <!-- Layer 2: Background Flow Graph Lines & Telemetry Waveforms (Behind Text) -->
  <path d="M 50 280 Q 200 220 350 260 T 650 200 T 950 240 T 1150 160 L 1150 340 L 50 340 Z" fill="url(#glowGradient)" />
  <path d="M 50 280 Q 200 220 350 260 T 650 200 T 950 240 T 1150 160" fill="none" stroke="url(#accentGradient)" stroke-width="3" opacity="0.6" class="flow-line" />

  <!-- Background Animated Telemetry Pills (Positioned safely away from center text) -->
  <g class="floating-pill-1" opacity="0.45">
    <rect x="80" y="55" width="110" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="135" y="76" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ APM</text>
  </g>

  <g class="floating-pill-2" opacity="0.45">
    <rect x="1010" y="55" width="110" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="1065" y="76" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📊 METRICS</text>
  </g>

  <g class="floating-pill-3" opacity="0.45">
    <rect x="95" y="270" width="120" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
    <text x="155" y="291" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔍 TRACES</text>
  </g>

  <g class="floating-pill-1" opacity="0.45">
    <rect x="980" y="270" width="130" height="32" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
    <text x="1045" y="291" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🐝 eBPF & OTel</text>
  </g>

  <!-- Telemetry Node Beacons -->
  <circle cx="350" cy="260" r="4" fill="#38bdf8" />
  <circle cx="350" cy="260" class="beacon" fill="none" stroke="#38bdf8" stroke-width="2" />

  <circle cx="650" cy="200" r="4" fill="#818cf8" />
  <circle cx="650" cy="200" class="beacon" fill="none" stroke="#818cf8" stroke-width="2" />

  <circle cx="950" cy="240" r="4" fill="#c084fc" />
  <circle cx="950" cy="240" class="beacon" fill="none" stroke="#c084fc" stroke-width="2" />

  <!-- Layer 3: FOREGROUND CONTENT (Guaranteed Unobstructed & Crystal Clear) -->
  <!-- Top Badge -->
  <g transform="translate(600, 75)">
    <rect x="-100" y="-16" width="200" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <text x="0" y="5" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">CURATED ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="155" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="900" letter-spacing="-0.5" text-anchor="middle" filter="url(#glow)">
    Awesome Application Monitoring
  </text>

  <!-- Subtitle -->
  <text x="600" y="195" fill="url(#accentGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" letter-spacing="0.5" text-anchor="middle">
    Full-Stack Observability • APM • Distributed Tracing • Error Tracking • Log Analytics
  </text>

  <!-- Decorative Separator Line -->
  <line x1="450" y1="225" x2="750" y2="225" stroke="url(#accentGradient)" stroke-width="2" opacity="0.8" stroke-linecap="round" />

  <!-- Footer Tagline in Banner -->
  <text x="600" y="250" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" text-anchor="middle">
    Empowering SREs, DevOps Teams &amp; Cloud Engineers with SaaS &amp; Open-Source Tools
  </text>
</svg>
