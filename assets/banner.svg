<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="orbGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.5" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseFade {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.75; }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatUpDown {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .grid-bg { animation: pulseFade 6s ease-in-out infinite; }
    .telemetry-line { stroke-dasharray: 8, 4; animation: dashMove 12s linear infinite; }
    .pill-anim-1 { animation: floatUpDown 4s ease-in-out infinite; }
    .pill-anim-2 { animation: floatUpDown 5s ease-in-out infinite 1s; }
    .pill-anim-3 { animation: floatUpDown 4.5s ease-in-out infinite 2s; }
  </style>

  <!-- Base Card Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#gridPattern)" class="grid-bg" />

  <!-- Background Ambient Glow Orbs -->
  <circle cx="200" cy="90" r="160" fill="url(#orbGlow1)" />
  <circle cx="1000" cy="270" r="180" fill="url(#orbGlow2)" />

  <!-- Background Waveforms & Telemetry Graph Line -->
  <path d="M 50 270 Q 200 210 350 250 T 650 190 T 950 230 T 1150 150 L 1150 340 L 50 340 Z" fill="url(#waveGrad)" />
  <path d="M 50 270 Q 200 210 350 250 T 650 190 T 950 230 T 1150 150" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.8" class="telemetry-line" />

  <!-- Telemetry Node Points -->
  <circle cx="350" cy="250" r="5" fill="#38bdf8" />
  <circle cx="650" cy="190" r="5" fill="#818cf8" />
  <circle cx="950" cy="230" r="5" fill="#c084fc" />

  <!-- Floating Telemetry Pills (Positioned safely at side corners) -->
  <g class="pill-anim-1" opacity="0.6">
    <rect x="70" y="45" width="110" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="125" y="66" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ APM</text>
  </g>

  <g class="pill-anim-2" opacity="0.6">
    <rect x="1020" y="45" width="110" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="1075" y="66" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📊 METRICS</text>
  </g>

  <g class="pill-anim-3" opacity="0.6">
    <rect x="80" y="280" width="120" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
    <text x="140" y="301" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔍 TRACES</text>
  </g>

  <g class="pill-anim-1" opacity="0.6">
    <rect x="1000" y="280" width="130" height="32" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
    <text x="1065" y="301" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🐝 eBPF &amp; OTel</text>
  </g>

  <!-- FOREGROUND TITLE & SUBTITLE (Always visible, crystal clear) -->
  <!-- Top Tag Badge -->
  <g transform="translate(600, 75)">
    <rect x="-110" y="-16" width="220" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <text x="0" y="5" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">CURATED ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="150" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" text-anchor="middle">
    Awesome Application Monitoring
  </text>

  <!-- Subtitle -->
  <text x="600" y="190" fill="url(#accentGrad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" text-anchor="middle">
    Full-Stack Observability • APM • Distributed Tracing • Error Tracking • Log Analytics
  </text>

  <!-- Divider Line -->
  <line x1="450" y1="220" x2="750" y2="220" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- Footer Description -->
  <text x="600" y="248" fill="#94a3b8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" text-anchor="middle">
    Empowering SREs, DevOps Teams &amp; Cloud Engineers with SaaS &amp; Open-Source Tools
  </text>
</svg>
